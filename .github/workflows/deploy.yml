name: Deploy to GitHub Pages

# Builds the demo site as a pure static export and publishes it to
# GitHub Pages, so the library opens directly at:
#   https://spos-systems.github.io/SPOS-Effects/
#
# In this static build the API routes are removed and the client switches to
# localStorage persistence for favorites & view counters (src/lib/client-store.ts),
# so every feature keeps working with zero backend.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancelling outdated runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build static site
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build static export
        env:
          STATIC_EXPORT: "1"
          NEXT_PUBLIC_STATIC: "1"
          NEXT_PUBLIC_BASE_PATH: /SPOS-Effects
          NEXT_PUBLIC_SITE_URL: https://spos-systems.github.io/SPOS-Effects
        run: |
          rm -rf src/app/api
          bun run build:export

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
