name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint
        run: bun run lint

  verify-css:
    name: Verify generated artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build spos-effects.css + AI metadata files
        run: |
          bun run build:css
          bun run build:meta

      - name: Ensure generated files are up to date
        run: |
          git diff --exit-code spos-effects.css
          git diff --exit-code public/effects.json public/llms.txt public/llms-full.txt public/humans.txt public/spos-effects.css
