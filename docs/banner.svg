<svg width="1280" height="320" viewBox="0 0 1280 320" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="bannerTitle bannerDesc">
  <title id="bannerTitle">SPOS Effects</title>
  <desc id="bannerDesc">SPOS Effects - 30 pure-CSS effects with live demos and copy-and-paste code, by SPOS Systems.</desc>

  <defs>
    <linearGradient id="logoGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>

    <radialGradient id="orbBlue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#3b82f6" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#3b82f6" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="orbViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#a78bfa" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>

    <pattern id="dotGrid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#475569" fill-opacity="0.22"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="#0a0f1c"/>
  <rect width="1280" height="320" fill="url(#dotGrid)"/>

  <!-- Soft glow orbs -->
  <circle cx="70" cy="10" r="300" fill="url(#orbBlue)"/>
  <circle cx="1220" cy="320" r="320" fill="url(#orbViolet)"/>

  <!-- Logo mark -->
  <rect x="64" y="100" width="120" height="120" rx="20" fill="url(#logoGradient)"/>
  <polygon points="127,128 95,166 124,166 121,192 153,154 124,154" fill="#ffffff"/>

  <!-- Wordmark -->
  <text x="216" y="148" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="64" font-weight="800" letter-spacing="-0.5" fill="#ffffff">SPOS Effects</text>

  <text x="216" y="192" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" fill="#93c5fd" direction="rtl" text-anchor="end">حلول برمجية متكاملة — من الفكرة إلى الإطلاق</text>

  <text x="216" y="228" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#94a3b8">30 pure-CSS effects · live demos · copy &amp; paste</text>

  <!-- Code block motif -->
  <g>
    <rect x="912" y="90" width="304" height="140" rx="16" fill="#111827" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="938" cy="116" r="5" fill="#334155"/>
    <circle cx="956" cy="116" r="5" fill="#334155"/>
    <circle cx="974" cy="116" r="5" fill="#334155"/>
    <rect x="938" y="142" width="186" height="10" rx="5" fill="#3b82f6" opacity="0.9"/>
    <rect x="958" y="168" width="132" height="10" rx="5" fill="#fbbf24" opacity="0.9"/>
    <rect x="938" y="194" width="204" height="10" rx="5" fill="#f472b6" opacity="0.9"/>
  </g>
</svg>
